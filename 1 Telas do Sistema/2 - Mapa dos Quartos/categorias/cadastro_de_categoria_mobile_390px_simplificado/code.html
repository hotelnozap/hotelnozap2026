<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0">
  <title>Cadastro de Categoria - Mobile (390px)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9ff;
      width: 390px;
      margin: 0 auto;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col relative pb-28">

  <!-- Cabeçalho Oficial Mobile: Degradê verde para preto (#003400 a #000000) -->
  <header class="w-full bg-gradient-to-r from-[#003400] to-[#000000] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
    <div class="flex items-center gap-3">
      <button type="button" class="p-1 hover:bg-white/10 rounded-lg transition-colors">
        <span class="material-symbols-outlined text-2xl">menu</span>
      </button>
      <div class="flex items-center gap-1.5 font-bold tracking-wider text-base">
        <span class="material-symbols-outlined text-emerald-400 text-xl">domain</span>
        <span>HOTEL NO ZAP</span>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" class="relative p-1 hover:bg-white/10 rounded-lg transition-colors">
        <span class="material-symbols-outlined text-2xl">notifications</span>
        <span class="absolute top-1 right-1 w-2 h-2 bg-emerald-400 rounded-full"></span>
      </button>
      <div class="w-8 h-8 rounded-full bg-emerald-800 text-white font-bold text-xs flex items-center justify-center border border-emerald-500/40">
        AD
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="flex-1 p-4 space-y-4">

    <!-- Link Voltar -->
    <div>
      <a href="#" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors">
        <span class="material-symbols-outlined text-base">arrow_back</span>
        Voltar para Categorias dos Quartos
      </a>
    </div>

    <!-- Card de Título e Status Switch -->
    <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-800 flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">category</span>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">Nova Categoria</h1>
          <p class="text-xs text-slate-400">Tipo de acomodação</p>
        </div>
      </div>

      <!-- Switch Ativa/Inativa -->
      <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-200/60">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" checked class="sr-only peer">
          <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-[#003400]"></div>
          <span class="ml-2 text-xs font-bold text-emerald-800">Ativa</span>
        </label>
      </div>
    </div>

    <!-- Card do Formulário: Nome, Ordenação e Observação -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      
      <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-4">
        
        <!-- Nome da Categoria -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
            Nome da Categoria <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-symbols-outlined text-lg">meeting_room</span>
            </span>
            <input 
              type="text" 
              required 
              placeholder="Ex: Suíte Presidencial, Chalé Família" 
              class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#003400] text-sm font-medium"
            >
          </div>
        </div>

        <!-- Ordenação -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
            Ordenação <span class="text-rose-500">*</span>
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
              <span class="material-symbols-outlined text-lg">format_list_numbered</span>
            </span>
            <input 
              type="number" 
              min="1" 
              value="1" 
              required 
              class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#003400] text-sm font-medium"
            >
          </div>
          <p class="mt-1 text-[11px] text-slate-400">Ordem de exibição nos mapas e listas.</p>
        </div>

        <!-- Observação -->
        <div>
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">
            Observação
          </label>
          <textarea 
            rows="4" 
            placeholder="Anotações internas, particularidades ou regras da categoria..." 
            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-[#003400] text-sm font-medium resize-none"
          ></textarea>
        </div>

      </div>

      <!-- Botões de Ação do Mobile -->
      <div class="space-y-2 pt-2">
        <button 
          type="submit" 
          class="w-full py-3 rounded-xl bg-[#003400] text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-[0.99] transition-all"
        >
          <span class="material-symbols-outlined text-lg">check_circle</span>
          Salvar Categoria
        </button>
        <button 
          type="button" 
          class="w-full py-2.5 rounded-xl border border-slate-200 bg-white text-slate-600 font-semibold text-sm hover:bg-slate-50 active:scale-[0.99] transition-all"
        >
          Cancelar
        </button>
      </div>

    </form>

  </main>

  <!-- Barra de Navegação Inferior (Bottom Navigation Bar) Fixa -->
  <nav class="fixed bottom-0 left-0 right-0 w-[390px] mx-auto bg-white border-t border-slate-200 py-2 px-4 flex justify-around items-center z-50 shadow-lg">
    <a href="#" class="flex flex-col items-center text-slate-500 hover:text-emerald-800 text-[10px] font-medium">
      <span class="material-symbols-outlined text-xl">grid_view</span>
      <span>Início</span>
    </a>
    <a href="#" class="flex flex-col items-center text-emerald-900 font-bold text-[10px] bg-emerald-50 px-3 py-1 rounded-xl">
      <span class="material-symbols-outlined text-xl">bed</span>
      <span>Quartos</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-500 hover:text-emerald-800 text-[10px] font-medium">
      <span class="material-symbols-outlined text-xl">calendar_month</span>
      <span>Reservas</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-500 hover:text-emerald-800 text-[10px] font-medium">
      <span class="material-symbols-outlined text-xl">payments</span>
      <span>Caixa</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-500 hover:text-emerald-800 text-[10px] font-medium">
      <span class="material-symbols-outlined text-xl">more_horiz</span>
      <span>Mais</span>
    </a>
  </nav>

</body>
</html>
