<style>

<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col md:hidden">
<!-- Header -->
<header class="px-margin-mobile py-4 flex items-center border-b border-border-subtle sticky top-0 z-10" style="background: linear-gradient(to right, rgb(0, 52, 0), rgb(0, 0, 0));">
<button aria-label="Voltar" class="mr-4 flex items-center justify-center p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm flex-1 truncate text-on-primary">Cadastro de Novo Item</h1>
</header>
<!-- Main Content Form -->
<main class="flex-1 px-margin-mobile py-6 overflow-y-auto custom-scrollbar">
<form class="flex flex-col gap-6"><a class="flex items-center gap-2 text-on-surface-variant hover:text-on-surface transition-colors py-2 w-fit" href="#">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
<span class="font-label-md text-label-md">Voltar para o Mapa dos Quartos</span>
</a>
<!-- Row 1: ID & Status -->
<div class="flex gap-4">
<div class="flex flex-col gap-2 flex-1">
<label class="font-label-md text-label-md text-on-surface-variant">Status</label>
<label class="flex items-center cursor-pointer" for="status_toggle">
<div class="relative">
<input checked="" class="sr-only" id="status_toggle" type="checkbox">
<div class="block bg-secondary w-12 h-6 rounded-full transition-colors duration-300"></div>
<div class="dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform duration-300 transform translate-x-6"></div>
</div>
<span class="ml-3 font-body-md text-body-md text-on-surface">Ativo</span>
</label>
</div>
</div>
<!-- Row 2: Nome -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="nome">Nome <span class="text-error">*</span></label>
<input class="bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors w-full" id="nome" placeholder="Ex: Cadeira Escritório" required="" type="text">
</div>
<!-- Row 3: Descrição -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="descricao">Descrição</label>
<textarea class="bg-surface-container-lowest border border-border-subtle rounded-lg px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors w-full resize-none" id="descricao" placeholder="Detalhes do item..." rows="3"></textarea>
</div>
<!-- Row 4: Categoria -->
<!-- Row 5: Quantidade & Valor -->
</form>
</main>
<!-- Footer Actions -->
<footer class="p-margin-mobile border-t border-border-subtle bg-surface-container-lowest flex gap-4 sticky bottom-0 z-10 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<button class="flex-1 py-3 px-4 rounded-xl border border-border-subtle bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors" type="button">
            Cancelar
        </button>
<button class="flex-1 py-3 px-4 rounded-xl bg-primary text-on-primary font-label-md text-label-md hover:bg-surface-tint transition-colors shadow-sm flex items-center justify-center gap-2" type="button">
<span class="material-symbols-outlined text-[18px]">save</span>
            Salvar Item
        </button>
</footer>
<script>
        // Simple toggle logic for visual feedback
        const toggleInput = document.getElementById('status_toggle');
        const toggleBg = toggleInput.nextElementSibling;
        const toggleDot = toggleBg.nextElementSibling;
        const toggleLabel = toggleInput.parentElement.nextElementSibling;

        toggleInput.addEventListener('change', function() {
            if (this.checked) {
                toggleBg.classList.replace('bg-outline-variant', 'bg-secondary');
                toggleDot.classList.replace('translate-x-0', 'translate-x-6');
                toggleLabel.textContent = 'Ativo';
            } else {
                toggleBg.classList.replace('bg-secondary', 'bg-outline-variant');
                toggleDot.classList.replace('translate-x-6', 'translate-x-0');
                toggleLabel.textContent = 'Inativo';
            }
        });
    </script>
